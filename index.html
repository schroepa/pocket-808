const ICON_PLAY='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2.5v13l11-6.5z" fill="currentColor"/></svg>';
const ICON_STOP='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="1" fill="currentColor"/></svg>';
function renderPlay(){
  const b=$('play');
  b.classList.toggle('on',playing);
  b.setAttribute('aria-pressed',playing);
  $('ico').innerHTML=playing?ICON_STOP:ICON_PLAY;
  $('playLabel').textContent=playing?'Stopp':'Start';
}
function renderBpm(){$('bpm').textContent=String(state.tempo).padStart(3,'0');}
function resetReadout(){const v=VOICES[state.sel];$('readout').textContent=v.id+' · '+v.name;}
function readout(text){
  $('readout').textContent=text;
  clearTimeout(flashT);
  flashT=setTimeout(resetReadout,1400);
}

function setNow(s){
  if(nowStep>=0){
    stepBtns[nowStep].classList.remove('now');
    for(let i=0;i<VOICES.length;i++) cells[i][nowStep].classList.remove('now');
  }
  nowStep=s;
  if(s>=0){
    stepBtns[s].classList.add('now');
    for(let i=0;i<VOICES.length;i++) cells[i][s].classList.add('now');
  }
  markRollNow(s);
  markSmpNow(s);
}
const subArr=(key,n)=>subOf(state.pat,key,n);
function paintStep(s){
  const id=VOICES[state.sel].id,sb=!!subArr(id,s),on=sb||!!state.pat[id][s];
  stepBtns[s].classList.toggle('on',on);
  stepBtns[s].classList.toggle('sub',sb);
  stepBtns[s].setAttribute('aria-pressed',on);
}
function paintCell(i,s){
  const id=VOICES[i].id,on=!!state.pat[id][s]||!!subArr(id,s);
  cells[i][s].classList.toggle('on',on);
  cells[i][s].setAttribute('aria-pressed',on);
}
function renderEditor(){
  const v=VOICES[state.sel];
  $('edTitle').innerHTML=v.id+'<small>'+v.name+(drumPcm[v.id]?' · '+String(drumName[v.id]||'Sample').slice(0,10):'')+'</small>';
  for(let s=0;s<16;s++) paintStep(s);
  renderDrumSub();renderDrumSmp();
}
function renderTracks(){
  VOICES.forEach((v,i)=>{
    rows[i].classList.toggle('sel',i===state.sel);
    rows[i].firstChild.classList.toggle('cust',!!drumPcm[v.id]);
    for(let s=0;s<16;s++) paintCell(i,s);
  });
}
function renderPreset(){
  presetBtns.forEach(b=>{
    const on=b.dataset.name===state.preset;
    b.classList.toggle('active',on);
    b.setAttribute('aria-pressed',on);
  });
}
function refreshAll(){
  renderEditor();renderTracks();renderBpm();renderPreset();
  renderSlots();renderChain();renderMode();renderSynth();renderSmp();renderRack();renderMixFx();syncFx();
  knobs.forEach(k=>k.paint());
  resetReadout();
}

function select(i){
  state.sel=i;
  renderEditor();
  rows.forEach((r,k)=>r.classList.toggle('sel',k===i));
  knobs.forEach(k=>k.paint());
  resetReadout();
  save();
}
function toggle(i,s){
  const id=VOICES[i].id;
  if(subArr(id,s)){
    clearSub(id,s);state.pat[id][s]=0;
    paintCell(i,s);
    if(i===state.sel){paintStep(s);renderDrumSub();}
    renderSlots();save();
    return;
  }
  const on=state.pat[id][s]?0:1;
  state.pat[id][s]=on;
  if(state.preset){state.preset=null;renderPreset();}
  paintCell(i,s);
  if(i===state.sel) paintStep(s);
  renderSlots();
  if(on&&!playing) audition(i);
  save();
}

function snap(){
  undo=JSON.parse(JSON.stringify({pat:state.pat,cur:state.cur,tempo:state.tempo,swing:state.swing,preset:state.preset}));
  if(undoBtn) undoBtn.disabled=false;
}
function undoLast(){
  if(!undo) return;
  state.cur=undo.cur;state.pat=state.patterns[undo.cur]=undo.pat;
  state.tempo=undo.tempo;state.swing=undo.swing;state.preset=undo.preset;
  undo=null;undoBtn.disabled=true;
  refreshAll();save();
}
function loadPreset(p){
  const keep=state.pat.notes,keepS=state.pat.smp,keepP={};
  Object.keys(state.pat.sub).forEach(k=>{if(k.charAt(0)==='P') keepP[k]=state.pat.sub[k];});
  state.pat=state.patterns[state.cur]=blankPat();
  state.pat.notes=keep;state.pat.smp=keepS;state.pat.sub=keepP;
  Object.keys(p.pat).forEach(id=>{if(state.pat[id]) state.pat[id]=parsePat(p.pat[id]);});
  state.tempo=p.tempo;state.swing=p.swing;state.preset=p.name;
}
function clearAll(){snap();state.pat=state.patterns[state.cur]=blankPat();state.preset=null;refreshAll();save();}
function clearTrack(){snap();const id=VOICES[state.sel].id;state.pat[id]=new Array(16).fill(0);delete state.pat.sub[id];state.preset=null;refreshAll();save();}

function addKnob(host,o){
  const wrap=document.createElement('div');wrap.className='knob-wrap';
  const el=document.createElement('div');el.className='knob';el.tabIndex=0;
  el.setAttribute('role','slider');
  el.setAttribute('aria-label',o.label);
  el.setAttribute('aria-valuemin','0');el.setAttribute('aria-valuemax','100');
  el.innerHTML='<div class="ring"></div><div class="dial"></div>';
  const lab=document.createElement('div');lab.className='knob-label';lab.textContent=o.label;
  wrap.appendChild(el);wrap.appendChild(lab);host.appendChild(wrap);

  const defVal=()=>typeof o.def==='function'?o.def():o.def;
  function paint(){
    const v=o.get();
    el.style.setProperty('--v',v);
    el.style.setProperty('--rot',(-135+v*270)+'deg');
    el.setAttribute('aria-valuenow',Math.round(v*100));
    el.setAttribute('aria-valuetext',String(o.fmt(v)));
  }
  function apply(v){
    o.set(v);paint();
    readout((o.tag?o.tag()+' ':'')+o.label+' '+o.fmt(v));
    save();
  }
  let drag=null,lastTap=0;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    drag={y:e.clientY,v:o.get(),moved:false};
    readout((o.tag?o.tag()+' ':'')+o.label+' '+o.fmt(o.get()));
  });
  el.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dy=drag.y-e.clientY;
    if(Math.abs(dy)>3) drag.moved=true;
    if(drag.moved){let nv=clamp(drag.v+dy/170,0,1);if(o.snap!=null&&Math.abs(nv-o.snap)<.03) nv=o.snap;apply(nv);}
  });
  el.addEventListener('pointerup',()=>{
    if(!drag) return;
    const moved=drag.moved;drag=null;
    if(moved){if(o.onEnd) o.onEnd();return;}
    const now=performance.now();
    if(now-lastTap<320){apply(defVal());lastTap=0;if(o.onEnd) o.onEnd();}
    else lastTap=now;
  });
  el.addEventListener('pointercancel',()=>{drag=null;});
  el.addEventListener('keydown',e=>{
    const d=e.shiftKey?.1:.02;
    let v=o.get();
    if(e.key==='ArrowUp'||e.key==='ArrowRight') v+=d;
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft') v-=d;
    else if(e.key==='Home') v=0;
    else if(e.key==='End') v=1;
    else return;
    e.preventDefault();
    apply(clamp(v,0,1));
  });
  knobs.push({paint:paint});
}

const fmtT=sec=>sec<1?Math.round(sec*1000)+' ms':sec.toFixed(2)+' s';
function addSlider(host,o){
  const wrap=document.createElement('div');wrap.className='sl';
  const el=document.createElement('div');el.className='sl-t';el.tabIndex=0;
  el.setAttribute('role','slider');el.setAttribute('aria-label',o.aria);
  el.setAttribute('aria-valuemin','0');el.setAttribute('aria-valuemax','100');
  el.innerHTML='<div class="sl-f"></div><div class="sl-h"></div>';
  const lab=document.createElement('div');lab.className='sl-l';lab.textContent=o.label;
  wrap.appendChild(el);wrap.appendChild(lab);host.appendChild(wrap);
  const defVal=()=>typeof o.def==='function'?o.def():o.def;
  function paint(){
    const v=o.get();
    el.style.setProperty('--v',v);
    el.setAttribute('aria-valuenow',Math.round(v*100));
    el.setAttribute('aria-valuetext',String(o.fmt(v)));
  }
  function apply(v){
    o.set(v);paint();
    readout((o.tag?o.tag()+' ':'')+o.aria+' '+o.fmt(v));
    save();
  }
  const fromY=e=>{const r=el.getBoundingClientRect();return clamp(1-(e.clientY-r.top-6)/Math.max(1,r.height-12),0,1);};
  let drag=false,moved=false,lastTap=0,sy=0;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    drag=true;moved=false;sy=e.clientY;
  });
  el.addEventListener('pointermove',e=>{
    if(!drag) return;
    if(Math.abs(e.clientY-sy)>3) moved=true;
    if(moved) apply(fromY(e));
  });
  el.addEventListener('pointerup',e=>{
    if(!drag) return;
    drag=false;
    if(moved){if(o.onEnd) o.onEnd();return;}
    const now=performance.now();
    if(now-lastTap<320){apply(defVal());lastTap=0;}
    else{apply(fromY(e));lastTap=now;}
    if(o.onEnd) o.onEnd();
  });
  el.addEventListener('pointercancel',()=>{drag=false;});
  el.addEventListener('keydown',e=>{
    const d=e.shiftKey?.1:.02;
    let v=o.get();
    if(e.key==='ArrowUp'||e.key==='ArrowRight') v+=d;
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft') v-=d;
    else if(e.key==='Home') v=0;
    else if(e.key==='End') v=1;
    else return;
    e.preventDefault();
    apply(clamp(v,0,1));
  });
  knobs.push({paint:paint});
}

function buildKnobs(){
  const m=$('masterKnobs'),ik=$('instKnobs');
  addKnob(m,{label:'Tempo',get:()=>(state.tempo-60)/140,
    set:v=>{state.tempo=Math.round(60+v*140);renderBpm();syncFx();},
    def:(90-60)/140,fmt:v=>Math.round(60+v*140)+' BPM'});
  addKnob(m,{label:'Swing',get:()=>state.swing,set:v=>{state.swing=v;},def:0,fmt:v=>Math.round(v*100)+' %'});
  addKnob(m,{label:'Master',get:()=>state.master,
    set:v=>{state.master=v;if(masterG) masterG.gain.setTargetAtTime(mastGain(v),ctx.currentTime,.02);},
    def:.8,fmt:v=>Math.round(v*100)});
  [['level','Level'],['tune','Tune'],['decay','Decay']].forEach(([key,label])=>{
    addKnob(ik,{label:label,
      get:()=>state.params[VOICES[state.sel].id][key],
      set:v=>{state.params[VOICES[state.sel].id][key]=v;if(key!=='level') queueRerender(state.sel);},
      def:()=>DEFAULTS[VOICES[state.sel].id][key],
      tag:()=>VOICES[state.sel].id,
      fmt:key==='tune'?(v=>{const n=Math.round((v-.5)*100);return (n>0?'+':'')+n;}):(v=>Math.round(v*100)),
      onEnd:()=>{if(!playing) audition(state.sel);}});
  });
}

function buildEditor(){
  const host=$('steps');
  for(let g=0;g<4;g++){
    const grp=document.createElement('div');grp.className='group';
    for(let k=0;k<4;k++){
      const s=g*4+k,b=document.createElement('button');
      b.type='button';b.className='step g'+g;
      b.setAttribute('aria-label','Step '+(s+1));b.setAttribute('aria-pressed','false');
      b.innerHTML='<span>'+(s+1)+'</span>';
      b.addEventListener('click',()=>{if(drumSub.on){drumSub.step=s;renderDrumSub();}else toggle(state.sel,s);});
      grp.appendChild(b);stepBtns[s]=b;
    }
    host.appendChild(grp);
  }
}
function buildTracks(){
  const host=$('tracks');
  VOICES.forEach((v,i)=>{
    const row=document.createElement('div');row.className='row';
    const lab=document.createElement('button');
    lab.type='button';lab.className='lab';lab.textContent=v.id;
    lab.setAttribute('aria-label',v.name+' wählen und anhören');
    lab.addEventListener('click',()=>{select(i);audition(i);});
    const wrap=document.createElement('div');wrap.className='cells';
    for(let s=0;s<16;s++){
      const c=document.createElement('button');
      c.type='button';c.className='cell g'+(s>>2);
      c.setAttribute('aria-label',v.name+' Step '+(s+1));c.setAttribute('aria-pressed','false');
      c.addEventListener('click',()=>{if(state.sel!==i) select(i);toggle(i,s);});
      wrap.appendChild(c);cells[i][s]=c;
    }
    row.appendChild(lab);row.appendChild(wrap);host.appendChild(row);rows[i]=row;
  });
}
function mkChip(text){
  const b=document.createElement('button');
  b.type='button';b.className='chip';b.textContent=text;
  return b;
}
function buildPresets(){
  const host=$('presets');
  PRESETS.forEach(p=>{
    const b=mkChip(p.name);b.dataset.name=p.name;
    b.addEventListener('click',()=>{snap();loadPreset(p);refreshAll();save();});
    host.appendChild(b);presetBtns.push(b);
  });
  const tools=$('tools');
  const copyB=mkChip('Kopieren');copyB.addEventListener('click',copyPattern);
  pasteBtn=mkChip('Einfügen');pasteBtn.disabled=!clip;pasteBtn.addEventListener('click',pastePattern);
  const clr=mkChip('Pattern leeren');clr.addEventListener('click',clearAll);
  undoBtn=mkChip('Zurück');undoBtn.disabled=!undo;undoBtn.addEventListener('click',undoLast);
  [copyB,pasteBtn,clr,undoBtn].forEach(b=>tools.appendChild(b));
}

/* ---------- Pattern-Bank ---------- */
function patHas(k){const p=state.patterns[k];return VOICES.some(v=>p[v.id].some(Boolean))||PARTS.some(id=>p.notes[id].some(Boolean))||p.smp.some(r=>r.some(Boolean))||Object.keys(p.sub).length>0;}
function viewPattern(k){
  if(!state.patterns[k]) return;
  state.cur=k;state.pat=state.patterns[k];state.preset=null;
  renderEditor();renderTracks();renderSlots();renderPreset();renderRoll();renderSub();renderSmp(true);
  save();
}
function buildSlots(){
  const host=$('slots');
  SLOTS.forEach(k=>{
    const b=document.createElement('button');
    b.type='button';b.className='slot';b.textContent=k;
    b.setAttribute('aria-label','Pattern '+k);
    b.addEventListener('click',()=>viewPattern(k));
    host.appendChild(b);slotBtns[k]=b;
  });
}
function renderSlots(){
  SLOTS.forEach(k=>{
    const b=slotBtns[k];
    if(!b) return;
    b.classList.toggle('sel',k===state.cur);
    b.classList.toggle('has',patHas(k));
    b.setAttribute('aria-pressed',k===state.cur);
  });
  if(addBtn) addBtn.textContent='+ '+state.cur+' anhängen';
}
function copyPattern(){
  clip=JSON.parse(JSON.stringify(state.pat));
  pasteBtn.disabled=false;
  readout('PATTERN '+state.cur+' KOPIERT');
}
function pastePattern(){
  if(!clip) return;
  snap();
  VOICES.forEach(v=>{state.pat[v.id]=clip[v.id].slice();});
  state.pat.notes=JSON.parse(JSON.stringify(clip.notes||blankPat().notes));
  state.pat.smp=JSON.parse(JSON.stringify(clip.smp||blankPat().smp));
  state.pat.sub=JSON.parse(JSON.stringify(clip.sub||{}));
  state.preset=null;
  refreshAll();save();
  readout('EINGEFÜGT IN '+state.cur);
}

/* ---------- Song ---------- */
function setMode(m){state.mode=m;songFirst=true;renderMode();save();}
function renderMode(){
  const s=state.mode==='song';
  $('modeSong').setAttribute('aria-checked',s);
  $('modePat').setAttribute('aria-checked',!s);
}
function paintChainPlay(){
  document.querySelectorAll('#chain .blk').forEach((b,i)=>b.classList.toggle('play',i===playIdx));
}
function renderChain(){
  const host=$('chain');
  host.innerHTML='';
  if(!state.song.length){
    const p=document.createElement('div');p.className='chain-empty';
    p.textContent='Noch leer. Wähle ein Pattern und tippe auf „anhängen“.';
    host.appendChild(p);
  }
  state.song.forEach((e,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='blk'+(i===selBlk?' sel':'')+(i===playIdx?' play':'');
    b.setAttribute('aria-label','Position '+(i+1)+': Pattern '+e.p+', '+e.n+' mal');
    b.innerHTML=e.p+'<small>×'+e.n+'</small>';
    b.addEventListener('click',()=>{
      selBlk=i;
      if(!(playing&&state.mode==='song')) viewPattern(e.p);
      renderChain();
    });
    host.appendChild(b);
  });
  const n=state.song.length,has=selBlk>=0&&selBlk<n;
  if(songBtns.minus){
    songBtns.minus.disabled=!has||state.song[selBlk].n<=1;
    songBtns.plus.disabled=!has||state.song[selBlk].n>=16;
    songBtns.left.disabled=!has||selBlk===0;
    songBtns.right.disabled=!has||selBlk===n-1;
    songBtns.del.disabled=!has;
    songBtns.add.disabled=n>=32;
  }
}
function bump(d){
  const e=state.song[selBlk];
  if(!e) return;
  e.n=clamp(e.n+d,1,16);renderChain();save();
}
function moveBlk(d){
  const j=selBlk+d;
  if(selBlk<0||j<0||j>=state.song.length) return;
  const t=state.song[selBlk];state.song[selBlk]=state.song[j];state.song[j]=t;
  selBlk=j;renderChain();save();
}
function delBlk(){
  if(selBlk<0) return;
  state.song.splice(selBlk,1);
  selBlk=Math.min(selBlk,state.song.length-1);
  renderChain();save();
}
function buildSong(){
  const host=$('songTools');
  const mk=(key,text,label,fn)=>{
    const b=mkChip(text);b.setAttribute('aria-label',label);
    b.addEventListener('click',fn);host.appendChild(b);songBtns[key]=b;return b;
  };
  addBtn=mk('add','','Aktuelles Pattern an den Song anhängen',()=>{
    if(state.song.length>=32) return;
    state.song.push({p:state.cur,n:1});
    selBlk=state.song.length-1;
    renderChain();save();
  });
  mk('minus','−','Wiederholungen verringern',()=>bump(-1));
  mk('plus','+','Wiederholungen erhöhen',()=>bump(1));
  mk('left','←','Nach vorne schieben',()=>moveBlk(-1));
  mk('right','→','Nach hinten schieben',()=>moveBlk(1));
  mk('del','Entfernen','Position entfernen',delBlk);
  $('songClear').addEventListener('click',()=>{state.song=[];selBlk=-1;renderChain();save();});
  $('modePat').addEventListener('click',()=>setMode('pattern'));
  $('modeSong').addEventListener('click',()=>setMode('song'));
}

/* ---------- Sub-Steps: jeder Step lässt sich in 16 Teile zerlegen ---------- */
const drumSub={on:false,step:-1,ctl:null},smpSub={on:false,step:-1,ctl:null};
function setSub(key,n,arr){
  const m=state.pat.sub[key]||(state.pat.sub[key]={});
  if(arr.some(Boolean)) m[n]=arr; else clearSub(key,n);
}
function clearSub(key,n){
  const m=state.pat.sub[key];
  if(!m) return;
  delete m[n];
  if(!Object.keys(m).length) delete state.pat.sub[key];
}
function toggleSub(key,n,k){
  const cur=subArr(key,n),a=cur?cur.slice():new Array(16).fill(0);
  a[k]=a[k]?0:1;
  setSub(key,n,a);
  return a[k];
}
function makeSub(host,o){
  host.innerHTML='';
  const title=document.createElement('div');title.className='cap-label';
  const grid=document.createElement('div');grid.className='sub-grid';
  const tools=document.createElement('div');tools.className='chips';
  host.appendChild(title);host.appendChild(grid);host.appendChild(tools);
  const btns=[];
  for(let k=0;k<16;k++){
    const b=document.createElement('button');
    b.type='button';b.className='sb'+(k%4===0?' q':'');b.textContent=k+1;
    b.setAttribute('aria-label','Sub-Step '+(k+1));b.setAttribute('aria-pressed','false');
    b.addEventListener('click',()=>{
      const n=o.step();
      if(n<0) return;
      const on=toggleSub(o.key(),n,k);
      if(on&&!playing) o.audition();
      o.changed();
    });
    grid.appendChild(b);btns.push(b);
  }
  [['Roll',()=>1],['÷2',k=>k%2===0],['÷4',k=>k%4===0],['Leeren',()=>0]].forEach(([label,fn])=>{
    const c=mkChip(label);
    c.addEventListener('click',()=>{
      const n=o.step();
      if(n<0) return;
      snap();
      setSub(o.key(),n,Array.from({length:16},(_,k)=>fn(k)?1:0));
      o.changed();
    });
    tools.appendChild(c);
  });
  return {render(){
    const n=o.step(),a=n>=0?subArr(o.key(),n):null;
    title.textContent=n>=0?o.label()+' · Step '+(n+1)+' · 16 Sub-Steps':'Tippe oben einen Step an';
    btns.forEach((b,k)=>{b.disabled=n<0;b.classList.toggle('on',!!(a&&a[k]));b.setAttribute('aria-pressed',!!(a&&a[k]));});
  }};
}
function renderDrumSub(){
  $('drumSubBtn').classList.toggle('active',drumSub.on);
  $('drumSubBtn').setAttribute('aria-pressed',drumSub.on);
  $('drumSubEd').hidden=!drumSub.on;
  stepBtns.forEach((b,n)=>b.classList.toggle('subsel',drumSub.on&&n===drumSub.step));
  if(drumSub.on&&drumSub.ctl) drumSub.ctl.render();
}
function buildSubEditors(){
  drumSub.ctl=makeSub($('drumSubEd'),{
    key:()=>VOICES[state.sel].id,step:()=>drumSub.step,
    label:()=>VOICES[state.sel].id,
    audition:()=>audition(state.sel),
    changed:()=>{const n=drumSub.step;paintStep(n);paintCell(state.sel,n);renderSlots();drumSub.ctl.render();save();}
  });
  smpSub.ctl=makeSub($('smpSubEd'),{
    key:()=>'P'+state.smp.sel,step:()=>smpSub.step,
    label:()=>'Pad '+(state.smp.sel+1),
    audition:()=>smpAudition(state.smp.sel),
    changed:()=>{paintSmpSteps();renderSlots();save();}
  });
  $('drumSubBtn').addEventListener('click',()=>{
    drumSub.on=!drumSub.on;

function drawWave(){
  const cv=$('wave'),g=cv.getContext&&cv.getContext('2d');
  if(!g) return;
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h) return;
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  g.fillStyle='rgba(211,146,90,.2)';g.fillRect(0,h/2,w,1);
  const i=state.smp.sel,pcm=smpPcm[i];
  if(!pcm) return;
  const per=pcm.length/w;
  g.fillStyle='#d3925a';
  for(let x=0;x<w;x++){
    const a=Math.floor(x*per),b=Math.min(pcm.length,Math.max(a+1,Math.floor((x+1)*per)));
    let mn=1,mx=-1;
    for(let k=a;k<b;k++){const v=pcm[k];if(v<mn)mn=v;if(v>mx)mx=v;}
    const y1=(1-mx)*h/2,y2=(1-mn)*h/2;
    g.fillRect(x,y1,1,Math.max(1,y2-y1));
  }
  const p=smpPad(),sx=p.start*w,ex=p.end*w;
  g.fillStyle='rgba(8,8,11,.78)';g.fillRect(0,0,sx,h);g.fillRect(ex,0,w-ex,h);
  g.fillStyle='#d4d4dc';g.fillRect(sx-1,0,2,h);g.fillRect(ex-1,0,2,h);
  g.beginPath();g.moveTo(sx,0);g.lineTo(sx+8,0);g.lineTo(sx,8);g.fill();
  g.beginPath();g.moveTo(ex,h);g.lineTo(ex-8,h);g.lineTo(ex,h-8);g.fill();
}

async function recToggle(){
  if(recorder){recorder.stop();return;}
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||typeof MediaRecorder==='undefined'){recFallback('Mikro hier nicht verfügbar');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){recFallback('Mikro gesperrt ('+(e&&e.name||'Fehler')+')');return;}
  const i=state.smp.sel,chunks=[],mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>{if(e.data&&e.data.size) chunks.push(e.data);};
  mr.onstop=async()=>{
    clearTimeout(recTimer);
    stream.getTracks().forEach(t=>t.stop());
    recorder=null;recBtn.textContent='Rec';recBtn.classList.remove('active');
    if(chunks.length) decodeInto(i,await new Blob(chunks).arrayBuffer(),'Aufnahme');
    else smpNote('Nichts aufgenommen');
  };
  mr.start();recorder=mr;
  recBtn.textContent='Stopp';recBtn.classList.add('active');

  });
  const clr=mkChip('Stimme leeren');
  clr.addEventListener('click',()=>{snap();state.pat.notes[state.part]=new Array(16).fill(null);renderRoll();renderSlots();save();});
  $('synTools').appendChild(clr);
}

/* ---------- Mixer & FX ---------- */
let mixSel='BD';const mixRows={};
function calcAud(){
  const any=CHS.some(id=>state.mix[id].s);
  CHS.forEach(id=>{const m=state.mix[id];aud[id]=!m.m&&(!any||m.s);});
}
function applyChan(id,init){
  if(!chan) return;
  const m=state.mix[id],c=chan[id],t=ctx.currentTime;
  const g=aud[id]?m.v*m.v*1.5625:0,pn=(m.p-.5)*2,sn=m.r;
  if(init){c.in.gain.value=g;c.pan.pan.value=pn;c.snd.gain.value=sn;return;}
  c.in.gain.setTargetAtTime(g,t,.015);
  c.pan.pan.setTargetAtTime(pn,t,.02);
  c.snd.gain.setTargetAtTime(sn,t,.02);
}
/* Impulsantwort: Rauschen mit exponentiellem Abfall, Höhen dämpfen sich mit der Zeit */
function buildIR(c,size,damp){
  const sr=c.sampleRate,len=.3+size*2.2,n=Math.floor(sr*len),pre=Math.floor(sr*.012),b=c.createBuffer(1,n,sr);
  const a0=.06+.9*Math.pow(1-damp,2);
  for(let ch=0;ch<1;ch++){
    const d=b.getChannelData(ch);let y=0;
    for(let i=pre;i<n;i++){
      const x=(i-pre)/(n-pre),a=Math.max(.03,a0*(1-.7*x));
      y+=((Math.random()*2-1)-y)*a;
      d[i]=y*Math.pow(1-x,2.6);
    }
  }
  return b;
}
const holdAt=(p,t)=>{if(p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t); else p.cancelScheduledValues(t);};
function applyFx(init){
  if(!chan) return;
  const f=state.fx,t=ctx.currentTime;
  if(init) rvOut.gain.value=f.ret*1.6; else rvOut.gain.setTargetAtTime(f.ret*1.6,t,.03);
  /* DJ-Filter: Mitte = beide Filter weit offen (neutral), links Tiefpass, rechts Hochpass */
  const d=f.dj-.5,x=Math.abs(d)*2,q=Math.abs(d)>.001?.7+f.djq*9:.7;
  const lpF=d<0?18000*Math.pow(200/18000,x):20000,hpF=d>0?20*Math.pow(4000/20,x):10;
  if(init){djLP.frequency.value=lpF;djHP.frequency.value=hpF;djLP.Q.value=q;djHP.Q.value=q;return;}
  djLP.frequency.setTargetAtTime(lpF,t,.02);djHP.frequency.setTargetAtTime(hpF,t,.02);
  djLP.Q.setTargetAtTime(q,t,.02);djHP.Q.setTargetAtTime(q,t,.02);
}
let irT=0;
function queueIR(){
  clearTimeout(irT);
  irT=setTimeout(()=>{
    if(!ctx||!rvConv) return;
    rvOut.gain.setTargetAtTime(0,ctx.currentTime,.01);
    /* neuer Convolver statt neuem Buffer am alten Knoten (portabel), alter Hall ist über den Return-Fade schon stumm */
    setTimeout(()=>{
      if(!rvConv||!ctx) return;
      const nc=ctx.createConvolver(),old=rvConv;
      nc.buffer=buildIR(ctx,state.fx.size,state.fx.damp);
      rvIn.connect(nc);nc.connect(rvOut);
      try{rvIn.disconnect(old);old.disconnect();}catch(_){}
      rvConv=nc;applyFx();
    },50);
  },150);
}
/* Stutter: ein Stück des Master-Signals wird in einer Delay-Schleife wiederholt, solange der Pad gehalten wird */
function mkStutter(){
  const c=ctx;
  st={inp:c.createGain(),dly:c.createDelay(2),fb:c.createGain(),out:c.createGain(),on:false};
  st.inp.gain.value=0;st.fb.gain.value=0;st.out.gain.value=0;
  bus.connect(st.inp);st.inp.connect(st.dly);st.dly.connect(st.fb);st.fb.connect(st.dly);st.dly.connect(st.out);st.out.connect(djIn);
}
function stutterOn(frac){
  if(!ensureAudio()) return;
  if(!st) mkStutter();
  const t=ctx.currentTime+.01,P=Math.min(1.9,60/state.tempo*frac);
  [st.inp.gain,st.fb.gain,st.out.gain,dryG.gain].forEach(p=>holdAt(p,t));
  st.dly.delayTime.cancelScheduledValues(t);st.dly.delayTime.setValueAtTime(P,t);
  st.inp.gain.setValueAtTime(1,t);st.inp.gain.setValueAtTime(1,t+P);st.inp.gain.linearRampToValueAtTime(0,t+P+.003);
  st.fb.gain.setValueAtTime(.999,t);
  st.out.gain.setValueAtTime(0,t+P-.001);st.out.gain.linearRampToValueAtTime(1,t+P+.003);
  dryG.gain.setValueAtTime(1,t+P-.001);dryG.gain.linearRampToValueAtTime(0,t+P+.003);
  st.on=true;
}
function stutterOff(){
  if(!st||!st.on) return;
  st.on=false;
  const t=ctx.currentTime+.005;
  [st.inp.gain,st.fb.gain,st.out.gain,dryG.gain].forEach(p=>holdAt(p,t));
  dryG.gain.linearRampToValueAtTime(1,t+.008);st.out.gain.linearRampToValueAtTime(0,t+.008);
  st.inp.gain.setValueAtTime(0,t);st.fb.gain.linearRampToValueAtTime(0,t+.02);
}
function toggleMute(id){state.mix[id].m=!state.mix[id].m;applyMixAll();renderSum();save();}
function toggleSolo(id){state.mix[id].s=!state.mix[id].s;applyMixAll();renderSum();save();}
function applyMixAll(){
  calcAud();
  if(chan){CHS.forEach(id=>applyChan(id));applyFx();syncFx();}
  renderMixFx();
}
function renderMixFx(){
  if(!mixRows[CHS[0]]) return;
  CHS.forEach(id=>{
    const r=mixRows[id],m=state.mix[id];
    r.m.classList.toggle('on',m.m);r.m.setAttribute('aria-pressed',m.m);
    r.s.classList.toggle('on',m.s);r.s.setAttribute('aria-pressed',m.s);
    r.row.classList.toggle('sel',id===mixSel);
    const v=String(Math.round(m.v*100));if(r.f.value!==v) r.f.value=v;
  });
  $('mixSelLbl').textContent='Kanal: '+CH_FULL[mixSel];
  const mc=CHS.filter(id=>state.mix[id].m),sl=CHS.filter(id=>state.mix[id].s);
  $('mixSum').textContent=(!mc.length&&!sl.length)?'13 Kanäle':[mc.length?mc.length+' stumm':'',sl.length?'Solo '+(sl.length===1?sl[0]:sl.length):''].filter(Boolean).join(' · ');
  const f=state.fx,d=f.dj-.5;
  $('fxSum').textContent='Reverb '+Math.round(f.ret*100)+'% · Filter '+(Math.abs(d)<.005?'aus':(d<0?'LP ':'HP ')+Math.round(Math.abs(d)*200)+'%');
  if(muteBtn){const mm=state.mix[state.part].m;muteBtn.classList.toggle('active',mm);muteBtn.setAttribute('aria-pressed',mm);}
}
function buildMixFx(){
  const host=$('mixRows');
  const selCh=id=>{if(mixSel===id) return;mixSel=id;renderMixFx();knobs.forEach(k=>k.paint());};
  CHS.forEach(id=>{
    const full=CH_FULL[id],row=document.createElement('div');row.className='mx';
    const nm=document.createElement('button');nm.type='button';nm.className='nm';
    nm.textContent=({BA:'Bass',LD:'Lead',SM:'Smp'})[id]||id;nm.setAttribute('aria-label','Kanal '+full+' wählen');
    nm.addEventListener('click',()=>selCh(id));
    const mb=document.createElement('button');mb.type='button';mb.className='mb m';mb.textContent='M';mb.setAttribute('aria-label',full+' stumm');
    mb.addEventListener('click',()=>toggleMute(id));
    const sb=document.createElement('button');sb.type='button';sb.className='mb s';sb.textContent='S';sb.setAttribute('aria-label',full+' solo');
    sb.addEventListener('click',()=>toggleSolo(id));
    const f=document.createElement('input');f.type='range';f.min=0;f.max=100;f.step=1;f.className='fd';f.setAttribute('aria-label','Lautstärke '+full);
    f.addEventListener('pointerdown',()=>selCh(id));
    f.addEventListener('input',()=>{state.mix[id].v=f.value/100;applyChan(id);readout(full+' Fader '+f.value);save();});
    f.addEventListener('dblclick',()=>{state.mix[id].v=.8;f.value=80;applyChan(id);save();});
    row.appendChild(nm);row.appendChild(mb);row.appendChild(sb);row.appendChild(f);host.appendChild(row);
    mixRows[id]={row:row,m:mb,s:sb,f:f};
  });
  const tag=()=>CH_FULL[mixSel].toUpperCase();
  addKnob($('mixKnobs'),{label:'Pan',tag:tag,get:()=>state.mix[mixSel].p,
    snap:.5,set:v=>{state.mix[mixSel].p=v;applyChan(mixSel);},def:.5,
    fmt:v=>Math.abs(v-.5)<.005?'Mitte':(v<.5?'L ':'R ')+Math.round(Math.abs(v-.5)*200)});
  addKnob($('mixKnobs'),{label:'Reverb',tag:tag,get:()=>state.mix[mixSel].r,
    set:v=>{state.mix[mixSel].r=v;applyChan(mixSel);applyFx();renderMixFx();},def:()=>mixDefaults()[mixSel].r,fmt:v=>Math.round(v*100)+'%'});
  const fx=state.fx;
  addKnob($('rvKnobs'),{label:'Return',tag:()=>'REVERB',get:()=>fx.ret,set:v=>{fx.ret=v;applyFx();renderMixFx();},def:.5,fmt:v=>Math.round(v*100)+'%'});
  addKnob($('rvKnobs'),{label:'Size',tag:()=>'REVERB',get:()=>fx.size,set:v=>{fx.size=v;queueIR();},def:.4,fmt:v=>(.3+v*2.2).toFixed(1)+' s'});
  addKnob($('rvKnobs'),{label:'Damp',tag:()=>'REVERB',get:()=>fx.damp,set:v=>{fx.damp=v;queueIR();},def:.5,fmt:v=>Math.round(v*100)+'%'});
  addKnob($('djKnobs'),{label:'Filter',tag:()=>'DJ',get:()=>fx.dj,
    snap:.5,set:v=>{fx.dj=v;applyFx();renderMixFx();},def:.5,
    fmt:v=>Math.abs(v-.5)<.005?'aus':(v<.5?'Tiefpass ':'Hochpass ')+Math.round(Math.abs(v-.5)*200)+'%'});
  addKnob($('djKnobs'),{label:'Reso',tag:()=>'DJ',get:()=>fx.djq,set:v=>{fx.djq=v;applyFx();},def:.2,fmt:v=>Math.round(v*100)+'%'});
  [['1/4',1],['1/8',.5],['1/16',.25],['1/32',.125]].forEach(([t,fr])=>{
    const b=document.createElement('button');b.type='button';b.className='stp';b.textContent=t;
    b.setAttribute('aria-label','Stutter '+t+' halten');
    const off=()=>{b.classList.remove('on');stutterOff();};
    b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}b.classList.add('on');stutterOn(fr);});
    b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
    $('stPads').appendChild(b);
  });
}

function init(data){
  loadPreset(PRESETS.find(p=>p.name==='Hip-Hop'));
  const b=blankPat();VOICES.forEach(v=>{b[v.id]=parsePat(SEED_B[v.id]||'');});
  state.patterns.B=b;
  Object.keys(SEED_NOTES).forEach(k=>{PARTS.forEach(id=>{(SEED_NOTES[k][id]||[]).forEach(n=>{state.patterns[k].notes[id][n[0]]={d:n[1],l:n[2]};});});});
  state.song=[{p:'A',n:3},{p:'B',n:1}];
  FACTORY.forEach((f,i)=>{smpPcm[i]=f.gen();state.smp.pads[i].name=f.name;});
  state.patterns.A.smp[1][15]=1;state.patterns.B.smp[2][8]=1;
  merge(loadStored());
  merge(data&&data.state);
  loadSmpStore();applySmpStore();calcAud();
  buildSlots();buildEditor();buildTracks();buildKnobs();buildPresets();buildSong();buildSynth();buildSmp();buildRacks();buildSubEditors();buildDrumSmp();buildMixFx();
  $('clearTrack').addEventListener('click',clearTrack);
  $('play').addEventListener('click',()=>{if(playing) stop(); else start();});
  renderPlay();
  refreshAll();
  warmAudio();
}

const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function') hot.snapshot(()=>({state:serial()}));
if(hot&&typeof hot.ready==='function') hot.ready(init); else init(hot&&hot.data);
})();
</script>
